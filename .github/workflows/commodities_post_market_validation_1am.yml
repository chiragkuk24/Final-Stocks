name: MCX Commodities 1:00 AM Post-Market Validation Pipeline

on:
  schedule:
    # Runs Monday through Friday at 19:30 UTC (1:00 AM IST next morning post MCX close)
    - cron: '30 19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-commodities-postmarket:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 6 — Run MCX Commodities 1:00 AM Post-Market Model Accuracy Validation
        run: |
          python validate_predictions.py

      - name: Push Updated MCX Commodities Validation Scorecard & Payload to Web Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Post_Market_Accuracy_Report.xlsx Post_Market_*.csv model_learning_feedback.json dashboard_data.json data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Auto-Update: 1:00 AM IST MCX Commodities Post-Market Validation & Learning Feedback [skip ci]" && git push)

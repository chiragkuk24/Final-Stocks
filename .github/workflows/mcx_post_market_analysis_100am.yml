name: MCX Post-Market Analysis & Learning Engine (1:00 AM IST)

on:
  schedule:
    # Runs Monday through Saturday at 19:30 UTC (1:00 AM IST next morning post MCX close)
    - cron: '30 19 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-mcx-postmarket-100am:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MCX Commodities Post-Market Validation
        run: |
          python validate_predictions.py

      - name: Run Self-Correcting Learning Engine
        run: |
          python post_market_learning_engine.py

      - name: Commit and Push MCX Accuracy Report & Learning Feedback
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Post_Market_Accuracy_Report.xlsx Post_Market_*.csv model_learning_feedback.json dashboard_data.json data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Auto-Update: 1:00 AM IST MCX Post-Market Analysis & Learning Feedback [skip ci]" && git pull --rebase origin main && git push)

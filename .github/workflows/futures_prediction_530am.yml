name: Futures Contracts ML Prediction Pipeline (5:30 AM IST)

on:
  schedule:
    # Runs Monday through Friday at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-futures-predictor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Futures Contracts ML Quant Predictor Engine (5:30 AM IST)
        run: |
          python ml_quant_predictor.py

      - name: Commit and Push Updated Futures Predictions & Web Dashboard Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Breakout_ML_Quant_Predictions.xlsx dashboard_data.json data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "📈 Auto-Update: 5:30 AM IST Current Month Futures Predictions [skip ci]" && git push)

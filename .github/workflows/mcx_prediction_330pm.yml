name: MCX Commodities ML Prediction (3:30 PM IST)

on:
  schedule:
    # Runs Monday through Saturday at 10:00 UTC (3:30 PM IST)
    - cron: '0 10 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-mcx-prediction-330pm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MCX Commodities ML Quant Predictor Engine
        run: |
          python ml_quant_predictor.py

      - name: Commit and Push Updated MCX Predictions & Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🪙 Auto-Update: 3:30 PM IST MCX Commodities ML Predictions [skip ci]" && git push)


name: Post-Market Analysis & Learning Engine (4:00 PM IST)

on:
  schedule:
    # Runs Monday through Saturday at 10:30 UTC (4:00 PM IST)
    - cron: '30 10 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-postmarket-400pm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Post-Market Validation
        run: |
          python validate_predictions.py

      - name: Run Self-Correcting Learning Engine
        run: |
          python post_market_learning_engine.py

      - name: Commit and Push Accuracy Report & Learning Feedback
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Auto-Update: 4:00 PM IST Post-Market Analysis & Learning Feedback [skip ci]" && git push)



name: Pre-Market Pipeline (5:30 AM IST)

on:
  schedule:
    # Runs Monday through Saturday at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-premarket-530am:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Initialization Scanner
        run: |
          python Initialization.py

      - name: Run US Market News Scanner
        run: |
          python us_market_news_scanner.py

      - name: Run Stocks & Futures ML Quant Predictor Engine
        run: |
          python ml_quant_predictor.py

      - name: Commit and Push Updated Predictions & Web Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Auto-Update: 5:30 AM IST Pre-Market Predictions & Scanner [skip ci]" && git push)


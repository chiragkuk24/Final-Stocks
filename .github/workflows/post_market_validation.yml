name: Post-Market 4:00 PM Accuracy Validation

on:
  schedule:
    # Runs Monday through Friday at 10:30 UTC (4:00 PM IST)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-accuracy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 6 — Run Post-Market Model Accuracy Validation
        run: |
          python validate_predictions.py

      - name: Push 3-Sheet Excel, CSVs & Accuracy Scorecard to Web Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Post_Market_Accuracy_Report.xlsx Post_Market_*.csv model_learning_feedback.json dashboard_data.json data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Auto-Update: 4:00 PM Post-Market 3-Sheet Validation & Learning Feedback [skip ci]" && git push)
